services:
  # Tier 1: Kong API Gateway
  kong:
    image: kong:3.6-alpine
    container_name: adlas-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    volumes:
      - ./infra/gateway/config/kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "${KONG_HTTP_PORT:-8000}:8000"
    networks:
      - adlas-network
    depends_on:
      - postgres
      - backend

  # Tier 1: PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: adlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adlas_db}
      POSTGRES_USER: ${POSTGRES_USER:-adlas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adlas_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/database/init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - adlas-network
    deploy:
      resources:
        limits:
          memory: 1024M

  # Tier 1: MinIO S3-Compatible Object Storage
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: adlas-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - adlas-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Tier 2: FastAPI Core Application Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adlas-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - adlas-network
    depends_on:
      - postgres
      - minio
    deploy:
      resources:
        limits:
          memory: 768M

  # Tier 2: React 18 Application Client (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adlas-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - adlas-network
    depends_on:
      - backend

  # Optional Offline Profile: Ollama Local Inference Server
  # Run only when explicitly requested: docker compose --profile offline up
  ollama:
    image: ollama/ollama:latest
    container_name: adlas-ollama
    restart: unless-stopped
    profiles:
      - offline
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - adlas-network
    deploy:
      resources:
        limits:
          memory: 8192M

networks:
  adlas-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  ollama_data:
